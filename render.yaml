services:
  - type: web
    name: agricloud-web
    runtime: php
    buildCommand: "composer install --no-dev --optimize-autoloader --no-interaction && APP_ENV=prod php bin/console cache:warmup --no-interaction"
    startCommand: "php -S 0.0.0.0:$PORT -t public public/index.php"
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
