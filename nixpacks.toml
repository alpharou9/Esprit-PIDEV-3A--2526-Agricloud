[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo_mysql",
    "php82Extensions.intl",
    "php82Extensions.mbstring",
    "php82Extensions.xml",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.gd",
    "php82Extensions.opcache"
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "APP_ENV=prod php bin/console cache:warmup --no-interaction"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public public/index.php"
